name: Desktop Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: privacyfinance-macos-apple-silicon
            artifact_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            release_notes: macOS beta build for Apple Silicon (.app/.dmg target)
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            artifact_name: privacyfinance-macos-intel
            artifact_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            release_notes: macOS beta build for Intel Macs (.app/.dmg target)
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: windows-latest
            artifact_name: privacyfinance-windows
            # Installers only; the bundle dirs also hold staging files.
            artifact_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*-setup.exe
            release_notes: Windows build output
            rust_targets: ''
            tauri_args: ''
          - os: ubuntu-22.04
            artifact_name: privacyfinance-linux
            artifact_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
            release_notes: Linux build output
            rust_targets: ''
            tauri_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            cmake \
            libclang-dev

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          # libclang comes with the Xcode Command Line Tools, which GitHub macOS runners preinstall.
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake llvm -y --no-progress
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # openssl-src rejects Git Bash's MSYS perl; use the runner's Strawberry Perl.
          echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install JS dependencies
        run: npm ci

      - name: macOS signing/notarization readiness
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          has_apple_id_auth=false
          has_api_key_auth=false
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            has_apple_id_auth=true
          fi
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            has_api_key_auth=true
          fi

          {
            echo "## macOS beta release readiness"
            echo ""
            echo "Target artifact: .dmg (beta distribution)"
            echo "Target lane: ${{ matrix.artifact_name }}"
            echo "Architectures covered by workflow: Apple Silicon + Intel (separate macOS artifacts)"
            echo ""
            echo "### Signing secrets"
            for key in \
              APPLE_CERTIFICATE \
              APPLE_CERTIFICATE_PASSWORD \
              APPLE_SIGNING_IDENTITY \
              APPLE_TEAM_ID \
              KEYCHAIN_PASSWORD; do
              if [ -n "${!key}" ]; then
                echo "- ${key}: configured"
              else
                echo "- ${key}: missing"
              fi
            done
            echo ""
            echo "### Notarization auth paths"
            echo "- Apple ID auth ready: ${has_apple_id_auth}"
            echo "- App Store Connect API key auth ready: ${has_api_key_auth}"
            echo ""
            echo "### Optional secret"
            if [ -n "$APPLE_PROVIDER_SHORT_NAME" ]; then
              echo "- APPLE_PROVIDER_SHORT_NAME: configured"
            else
              echo "- APPLE_PROVIDER_SHORT_NAME: not set"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Write App Store Connect API key file
        if: runner.os == 'macOS' && env.HAS_APPLE_API_KEY == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p private_keys
          printf '%s' "$APPLE_API_KEY_P8" > "private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$PWD/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Build desktop bundles
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Unset Apple variables whose secret is missing, so Tauri builds unsigned instead of failing.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD APPLE_PROVIDER_SHORT_NAME APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -n "${{ matrix.tauri_args }}" ]; then
            npm exec tauri -- build ${{ matrix.tauri_args }}
          else
            npm exec tauri -- build
          fi

      - name: Summarize expected artifacts
        shell: bash
        run: |
          {
            echo "## ${RUNNER_OS} artifact summary"
            echo ""
            echo "Expected output: ${{ matrix.release_notes }}"
            echo "Artifact glob: \`${{ matrix.artifact_glob }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Attach bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          draft: true
          generate_release_notes: true

# Future release hardening to add:
# - enable actual macOS signing + notarization once Apple secrets are configured
# - add Windows code-signing path
# - add updater signing if/when auto-update is introduced
# - split beta vs stable release channels
