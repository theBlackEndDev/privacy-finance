name: Desktop Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: privacyfinance-macos-apple-silicon
            artifact_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/**
            release_notes: macOS beta build for Apple Silicon (.app/.dmg target)
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
          - os: macos-latest
            artifact_name: privacyfinance-macos-intel
            artifact_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/**
            release_notes: macOS beta build for Intel Macs (.app/.dmg target)
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - os: windows-latest
            artifact_name: privacyfinance-windows
            artifact_glob: src-tauri/target/release/bundle/**
            release_notes: Windows build output
            rust_targets: ''
            tauri_args: ''
          - os: ubuntu-22.04
            artifact_name: privacyfinance-linux
            artifact_glob: src-tauri/target/release/bundle/**
            release_notes: Linux build output
            rust_targets: ''
            tauri_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev

      - name: Install JS dependencies
        run: npm ci

      - name: macOS signing/notarization readiness
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          {
            echo "## macOS beta release readiness"
            echo ""
            echo "Target artifact: .dmg (beta distribution)"
            echo "Target lane: ${{ matrix.artifact_name }}"
            echo "Architectures covered by workflow: Apple Silicon + Intel (separate macOS artifacts)"
            echo ""
            echo "### Secret presence"
            for key in \
              APPLE_CERTIFICATE \
              APPLE_CERTIFICATE_PASSWORD \
              APPLE_SIGNING_IDENTITY \
              APPLE_TEAM_ID \
              APPLE_ID \
              APPLE_APP_SPECIFIC_PASSWORD \
              APPLE_API_KEY_ID \
              APPLE_API_ISSUER \
              APPLE_API_KEY; do
              if [ -n "${!key}" ]; then
                echo "- ${key}: configured"
              else
                echo "- ${key}: missing"
              fi
            done
            echo ""
            echo "Note: this workflow currently builds macOS artifacts and reports signing/notarization readiness."
            echo "Actual signing/notarization steps should be enabled after secrets are provided."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build desktop bundles
        shell: bash
        run: |
          if [ -n "${{ matrix.tauri_args }}" ]; then
            npm exec tauri -- build ${{ matrix.tauri_args }}
          else
            npm exec tauri -- build
          fi

      - name: Summarize expected artifacts
        shell: bash
        run: |
          {
            echo "## ${RUNNER_OS} artifact summary"
            echo ""
            echo "Expected output: ${{ matrix.release_notes }}"
            echo "Artifact glob: \
`${{ matrix.artifact_glob }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      - name: Attach bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          draft: true
          generate_release_notes: true

# Future release hardening to add:
# - enable actual macOS signing + notarization once Apple secrets are configured
# - add Windows code-signing path
# - add updater signing if/when auto-update is introduced
# - split beta vs stable release channels
